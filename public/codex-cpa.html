<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPT 登录 + CPA 上传 - AI 账号管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔑 GPT 登录 + CPA 上传</h1>
      <nav>
        <a href="index.html">首页</a>
        <a href="batch.html">批量注册</a>
        <a href="accounts.html">账号管理</a>
        <a href="codex-cpa.html" class="active">GPT CPA</a>
      </nav>
    </header>

    <main>
      <!-- 账号信息 -->
      <section class="config-panel">
        <h2>账号信息</h2>
        <form id="upload-form">
          <div class="form-group">
            <label for="email">GPT 邮箱</label>
            <input type="email" id="email" name="email" placeholder="example@domain.com" required>
          </div>

          <div class="form-group">
            <label for="password">GPT 密码</label>
            <input type="password" id="password" name="password" placeholder="密码" required>
          </div>

          <div class="actions">
            <button type="submit" id="upload-btn" class="btn btn-primary">开始上传</button>
          </div>
        </form>
      </section>

      <!-- 结果面板 -->
      <section class="progress-panel">
        <h2>处理结果</h2>
        <div class="result-display" id="result-display">
          <p class="placeholder">等待上传...</p>
        </div>
      </section>

      <!-- 日志面板 -->
      <section class="log-panel">
        <h2>
          实时日志
          <button id="clear-log" class="btn btn-small">清空</button>
        </h2>
        <div class="log-container" id="log-container"></div>
      </section>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script>
    // 页面初始化
    document.addEventListener('DOMContentLoaded', async () => {
      // 表单提交
      document.getElementById('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const uploadBtn = document.getElementById('upload-btn');
        const resultDisplay = document.getElementById('result-display');

        const formData = new FormData(e.target);
        const email = formData.get('email');
        const password = formData.get('password');

        uploadBtn.disabled = true;
        addLog('开始 GPT 登录 + CPA 上传...', 'info');
        resultDisplay.innerHTML = '<p class="processing">处理中...</p>';

        try {
          const response = await fetch('/api/codex-cpa/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });

          const result = await response.json();

          if (result.success) {
            const data = result.data;
            const statusClass = data.cpaUploaded ? 'success' : 'error';
            const statusIcon = data.cpaUploaded ? '✅' : '❌';
            
            resultDisplay.innerHTML = `
              <div class="result-card ${statusClass}">
                <h3>${statusIcon} ${data.message}</h3>
                <div class="result-details">
                  <p><strong>邮箱:</strong> ${data.email}</p>
                  <p><strong>CPA 上传:</strong> ${data.cpaUploaded ? '成功' : '失败'}</p>
                  ${data.accessToken ? `<p><strong>Access Token:</strong> ${data.accessToken.slice(0, 30)}...</p>` : ''}
                  <p><strong>时间:</strong> ${new Date(data.timestamp).toLocaleString()}</p>
                </div>
              </div>
            `;
            
            addLog(`处理完成: ${data.message}`, data.cpaUploaded ? 'success' : 'error');
          } else {
            resultDisplay.innerHTML = `<p class="error">错误: ${result.error}</p>`;
            addLog(`上传失败: ${result.error}`, 'error');
          }
        } catch (error) {
          resultDisplay.innerHTML = `<p class="error">请求失败: ${error.message}</p>`;
          addLog(`请求失败: ${error.message}`, 'error');
        } finally {
          uploadBtn.disabled = false;
        }
      });

      // 清空日志
      document.getElementById('clear-log').addEventListener('click', () => {
        document.getElementById('log-container').innerHTML = '';
      });

      // 添加日志
      function addLog(message, type = 'info') {
        const container = document.getElementById('log-container');
        const logEntry = document.createElement('div');
        logEntry.className = `log-entry log-${type}`;
        logEntry.textContent = message;
        container.appendChild(logEntry);
        container.scrollTop = container.scrollHeight;
      }
    });
  </script>
</body>
</html>
